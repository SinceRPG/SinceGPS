database:
  file: "database.db"
  table-prefix: "sincegps_"

settings:
  nearest-node-search-range: 100.0
  reach-distance: 3.0
  update-rate: 1

  algorithm:
    curve-resolution: 8
    optimization-angle: 5.0
    smart-search-range: 100

  recorder:
    min-distance: 8.0
    angle-threshold: 15.0
    snap-distance: 3.0

  navigation:
    reroute-distance: 12.0
    check-interval: 20
    lead-in-min-distance: 2.0
    lead-in-step: 0.5
    suggestion-threshold: 0.6

visuals:
  view-distance: 60.0

  navigation:
    path-type: DUST
    path-color: "0, 255, 255"
    pulse-type: DUST
    pulse-color: "255, 165, 0"
    pulse-speed: 1.5
    particle-y-offset: 0.5
    bossbar-scale-distance: 50.0
    arrow-enabled: true
    arrow-lookahead: 8

  recorder:
    node-normal: FLAME
    node-new: HAPPY_VILLAGER
    node-snap: SOUL_FIRE_FLAME
    edge-line: CRIT
    edge-density: 2.0
    particle-y-offset: 0.5
    visualizer-range: 40.0
    update-interval: 20

action-bar:
  enabled: true
  arrows:
    forward: "UP"
    left: "LEFT"
    right: "RIGHT"
    backward: "BACK"
  format: "<yellow><bold><arrow> <white>Go forward <gold><dist>m"

groups:
  default:
    permission: ""
    navigable: true
  admin:
    permission: "gps.group.admin"
    navigable: true

sounds:
  start:
    enabled: true
    type: BLOCK_BEACON_ACTIVATE
    volume: 1.0
    pitch: 2.0
  stop:
    enabled: true
    type: BLOCK_NOTE_BLOCK_BASS
    volume: 1.0
    pitch: 0.5
  arrive:
    enabled: true
    type: UI_TOAST_CHALLENGE_COMPLETE
    volume: 1.0
    pitch: 1.0
  popup:
    enabled: true
    type: ENTITY_VILLAGER_NO
    volume: 1.0
    pitch: 1.0
  snap:
    enabled: true
    type: BLOCK_NOTE_BLOCK_PLING
    volume: 1.0
    pitch: 2.0
