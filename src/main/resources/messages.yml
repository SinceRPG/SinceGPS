prefix: "<gradient:#00FFAA:#00AAFF><bold>SinceGPS</bold></gradient> <gray>> "

help-header: "<gradient:#00FFAA:#00AAFF><bold>SinceGPS Commands</bold></gradient>"
help-to: "<gray>/gps to <destination> <white>- Start navigation."
help-list: "<gray>/gps list <white>- Show available destinations."
help-stop: "<gray>/gps stop <white>- Stop your current navigation."
help-move: "<gray>/gps move <white>- Toggle arrow move mode. Scroll to adjust the arrow."
help-admin: "<gray>Admin: /gps record, show, create, delete, movehere, connect, disconnect, setname, setgroup, reload."
reload-success: "<green>Configuration and database reloaded."
path-found: "<green>Route found to <target>! <gray>(<distance>m)"
path-not-found: "<red>No valid route was found."
node-not-found: "<red>Destination not found."
correction: "<yellow>Did you mean <gold><guess><yellow>? <click:run_command:'/gps to <guess_raw>'><hover:show_text:'&eClick to navigate to &f<guess_raw>'><aqua>[CLICK TO GO]</hover></click>"
stopped: "<red>GPS navigation stopped."
arrived: "<yellow><bold>YOU HAVE ARRIVED!"
no-permission: "<red>You do not have permission to navigate to that area."
rerouting: "<gray><i>Recalculating route..."
arrow-move-enabled: "<green>Arrow move mode enabled. Scroll to move forward/backward, sneak-scroll to move up/down."
arrow-move-disabled: "<yellow>Arrow move mode disabled."
preview-enabled: "<green>GPS graph preview enabled."
preview-disabled: "<yellow>GPS graph preview disabled."

list-header: "<gradient:#FFD700:#FFA500><bold> GPS DESTINATIONS </bold></gradient>"
list-item: " <gray>- <white><name> <dark_gray>[<group>] <green><click:run_command:'/gps to <id>'><hover:show_text:'&7Click to navigate to &f<name>'>[GO]</hover></click>"

name-set: "<green>Node <id> display name changed to: <name>"
group-set: "<green>Node <yellow><node> <green>moved to group: <aqua><group>"
group-not-found: "<red>Group '<group>' does not exist in config.yml."
node-name-exists: "<red>A node named '<name>' already exists."
same-node: "<red>You cannot connect a node to itself."
node-created: "<green>Created node <id> named <name> at your location."
node-deleted: "<yellow>Deleted node <id>."
node-moved: "<green>Moved node <id> to your location and recalculated its edge weights."
nodes-connected: "<green>Connected node <from> to node <to>."
nodes-disconnected: "<yellow>Disconnected node <from> from node <to>."

record-started: "<green><bold>REC:</bold> <gray>Started recording. <yellow>Walk to the destination."
record-stopped: "<red><bold>REC:</bold> <gray>Stopped. <yellow>Optimized and removed <count> extra nodes."
record-too-short: "<red><bold>REC:</bold> <gray>The recorded path was too short and was discarded."
record-snap: "<yellow>Snapped to an existing route node (<id>)."

record-summary-start: "<gray>+- Start point (<id>): <gold><click:suggest_command:'/gps setname <raw_id> '><hover:show_text:'&eClick to name the start point'>[SET NAME]</hover></click>"
record-summary-end: "<gray>+- End point (<id>): <gold><click:suggest_command:'/gps setname <raw_id> '><hover:show_text:'&eClick to name the destination'>[SET NAME]</hover></click>"

bossbar-title: "<bold>Target:</bold> <yellow><dist>m"
